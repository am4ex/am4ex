name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF8A4C&color_dots=#ebedf0,#f3dcc8,#e8b48a,#c8957a,#8b5e3c
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8A4C&color_dots=#161b22,#3d2c22,#6b4630,#c8957a,#e8b48a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
